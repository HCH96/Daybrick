# gitleaks 설정: 기본 규칙에 이 프로젝트가 쓰는 키 모양을 더한다.
# 커밋 전 훅(.githooks/pre-commit)이 이 파일을 읽는다.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key-daybrick"
description = "Anthropic API 키"
regex = '''sk-ant-[a-z]{3,6}\d{2}-[A-Za-z0-9_-]{40,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "supabase-secret-key"
description = "Supabase 비밀 키 (sb_secret_)"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "supabase-access-token"
description = "Supabase 개인 접속 토큰 (PAT, sbp_)"
regex = '''sbp_[a-f0-9]{40}'''
keywords = ["sbp_"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth 클라이언트 비밀값"
regex = '''GOCSPX-[A-Za-z0-9_-]{28}'''
keywords = ["GOCSPX-"]
